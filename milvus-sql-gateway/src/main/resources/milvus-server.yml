# MySQL protocol server settings
port: 3307
host: "0.0.0.0"
maxConnections: 100
# MySQL protocol authentication
# If both are empty, any username/password is accepted
mysqlUsername: "root"
mysqlPassword: "1111111111"
# SSL/TLS settings
# When sslEnabled is true, a self-signed certificate will be auto-generated
sslEnabled: false
# Authentication plugin for MySQL protocol clients
# Supported values: mysql_native_password, mysql_clear_password
authPlugin: "mysql_native_password"

# Connection idle timeout in seconds (default: 30 minutes)
# Connections with no activity for this duration will be closed automatically
idleTimeoutSeconds: 1800

# Milvus backend connection settings
milvusHost: "localhost"
milvusPort: 19530
milvusDatabase: "default"
milvusUsername: ""
milvusPassword: ""
